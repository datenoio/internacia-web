name: Data bump

# Daily: if internacia-db has a newer release than internacia.lock.json pins, fetch and verify it,
# build and check the site, and open a pull request that moves the lock file (SPEC §11.3).
#
# internacia-db's release workflow can also start it at once with a repository_dispatch event of
# type internacia-db-release and client_payload {"tag": "vX.Y.Z"}; the tag is checked against the
# release tag pattern before use.
#
# A release with a new contract MAJOR fails at "Fetch and verify" on purpose: the pipeline must be
# updated first. Pull requests opened with GITHUB_TOKEN do not start other workflows, so the Site
# workflow does not run on them by itself; this workflow already built and checked the site, and
# closing and reopening the pull request starts the Site workflow if a fresh run is wanted.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to move to (default the latest release)
        required: false
  repository_dispatch:
    types: [internacia-db-release]

permissions:
  contents: read

concurrency:
  group: data-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements-dev.txt

      - name: Read the requested tag
        id: req
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.client_payload.tag }}
        run: |
          tag="${INPUT_TAG:-$EVENT_TAG}"
          if [ -n "$tag" ] && ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::the requested tag is not a release tag of the form vX.Y.Z"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check for a newer release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/bump.py check

      - name: Build data for the pinned release
        if: steps.check.outputs.newer == 'true' || steps.req.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python pipeline/fetch.py
          python pipeline/build_data.py
          cp site/src/generated/meta.json "$RUNNER_TEMP/old-meta.json"

      - name: Move the lock file
        id: update
        if: steps.check.outputs.newer == 'true' || steps.req.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.req.outputs.tag }}
        run: python pipeline/bump.py update ${TAG:+--tag "$TAG"}

      - name: Fetch and verify the new release
        if: steps.update.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python pipeline/fetch.py
          python -m pytest pipeline/tests -q
          python pipeline/build_data.py
          python pipeline/bump.py summary "$RUNNER_TEMP/old-meta.json" site/src/generated/meta.json > "$RUNNER_TEMP/summary.md"

      - name: Set up Node.js
        if: steps.update.outputs.tag != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build and check the site
        if: steps.update.outputs.tag != ''
        run: |
          (cd site && npm ci && npm run build)
          python pipeline/check_site.py

      - name: Open pull request
        if: steps.update.outputs.tag != ''
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: data-bump/${{ steps.update.outputs.tag }}
          add-paths: internacia.lock.json
          commit-message: Move to internacia-db ${{ steps.update.outputs.tag }}
          title: Move to internacia-db ${{ steps.update.outputs.tag }}
          body-path: ${{ runner.temp }}/summary.md
          delete-branch: true
