name: Site

# Builds the site from the pinned internacia-db release (SPEC §10.3, §11.1).
# Pull requests build and upload the site as an artifact for review; pushes to main deploy it
# to GitHub Pages and, once the repository variable AX42_HOST is set, to the AX42 server
# (SPEC §11.4, deploy/ax42/README.md).

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements-dev.txt

      - name: Test pipeline
        run: python -m pytest pipeline/tests -q

      # Cached files are re-verified against SHA256SUMS by fetch.py on every run.
      - name: Cache internacia-db release
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/internacia
          key: internacia-${{ hashFiles('internacia.lock.json') }}

      - name: Fetch and verify internacia-db release
        run: python pipeline/fetch.py

      - name: Build site data
        run: python pipeline/build_data.py

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Check site against the data (SPEC §12)
        run: python pipeline/check_site.py

      - name: Install Chromium for the audit
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Audit accessibility and performance (axe, Lighthouse)
        working-directory: site
        run: npm run audit

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

      - name: Upload preview artifact
        if: github.event_name != 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-preview
          path: site/dist
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The same build, to the AX42 server (SPEC §11.4). Inactive until the repository variable
  # AX42_HOST (the server's IPv4 address) is set. AX42_KNOWN_HOSTS pins the server's host key;
  # the ax42 environment's secret AX42_SSH_KEY is a key that can only run internacia-receive.
  # AX42_SITE_HOST, if set, is the address checked after the upload (default internacia.io).
  deploy-ax42:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AX42_HOST != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ax42
    concurrency:
      group: deploy-ax42
      cancel-in-progress: false
    steps:
      - name: Download the site build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/site

      - name: Upload to the server and make it live
        env:
          AX42_HOST: ${{ vars.AX42_HOST }}
          AX42_KNOWN_HOSTS: ${{ vars.AX42_KNOWN_HOSTS }}
          AX42_SSH_KEY: ${{ secrets.AX42_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AX42_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$AX42_SSH_KEY" > ~/.ssh/ax42
          chmod 600 ~/.ssh/ax42
          zstd -q -T0 -c "$RUNNER_TEMP/site/artifact.tar" \
            | ssh -i ~/.ssh/ax42 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
                "internacia-deploy@$AX42_HOST" deploy "$GITHUB_SHA"

      - name: Check that the server serves this build
        env:
          AX42_HOST: ${{ vars.AX42_HOST }}
          SITE_HOST: ${{ vars.AX42_SITE_HOST || 'internacia.io' }}
        run: |
          tar -xOf "$RUNNER_TEMP/site/artifact.tar" ./index.html | sha256sum > expected
          curl -fsS --retry 3 --resolve "$SITE_HOST:443:$AX42_HOST" "https://$SITE_HOST/" | sha256sum > served
          diff expected served
