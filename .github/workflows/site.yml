name: Site

# Builds the site from the pinned internacia-db release (SPEC §10.3, §11.1).
# Pull requests build and upload the site as an artifact for review; pushes to main deploy it
# to GitHub Pages.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements-dev.txt

      - name: Test pipeline
        run: python -m pytest pipeline/tests -q

      # Cached files are re-verified against SHA256SUMS by fetch.py on every run.
      - name: Cache internacia-db release
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/internacia
          key: internacia-${{ hashFiles('internacia.lock.json') }}

      - name: Fetch and verify internacia-db release
        run: python pipeline/fetch.py

      - name: Build site data
        run: python pipeline/build_data.py

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Check site against the data (SPEC §12)
        run: python pipeline/check_site.py

      - name: Install Chromium for the audit
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Audit accessibility and performance (axe, Lighthouse)
        working-directory: site
        run: npm run audit

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

      - name: Upload preview artifact
        if: github.event_name != 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-preview
          path: site/dist
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
